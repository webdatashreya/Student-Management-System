<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        header {
            background: #4a69bd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #4a69bd;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #3b55a0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #4a69bd;
            color: white;
        }

        .delete-btn {
            background: #e74c3c;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            min-width: 200px;
            background: #eef2ff;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }

        .stat-box h3 {
            margin: 0;
            font-size: 30px;
            color: #4a69bd;
        }
    </style>
</head>

<body>

<header>
    <h1>Class Management System</h1>
    <p>Manage Students, Classes and Attendance</p>
</header>

<div class="container">

    <!-- Dashboard -->
    <div class="card">
        <h2>Dashboard</h2>

        <div class="stats">
            <div class="stat-box">
                <h3 id="studentCount">0</h3>
                <p>Total Students</p>
            </div>

            <div class="stat-box">
                <h3 id="classCount">0</h3>
                <p>Total Classes</p>
            </div>

            <div class="stat-box">
                <h3 id="attendanceCount">0</h3>
                <p>Present Students</p>
            </div>
        </div>
    </div>

    <!-- Add Student -->
    <div class="card">
        <h2>Add Student</h2>

        <input type="text" id="studentName" placeholder="Enter Student Name">

        <input type="text" id="rollNo" placeholder="Enter Roll Number">

        <input type="text" id="course" placeholder="Enter Course">

        <button onclick="addStudent()">Add Student</button>
    </div>

    <!-- Student List -->
    <div class="card">
        <h2>Student List</h2>

        <table>
            <thead>
                <tr>
                    <th>Sr. No.</th>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Course</th>
                    <th>Attendance</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>
    </div>

    <!-- Class Management -->
    <div class="card">
        <h2>Class Management</h2>

        <input type="text" id="className" placeholder="Enter Class Name">

        <button onclick="addClass()">Add Class</button>

        <ul id="classList"></ul>
    </div>

</div>

<script>

    let students = [];
    let classes = [];

    // Add Student
    function addStudent() {

        let name = document.getElementById("studentName").value;
        let roll = document.getElementById("rollNo").value;
        let course = document.getElementById("course").value;

        if (name === "" || roll === "" || course === "") {
            alert("Please fill all student details!");
            return;
        }

        students.push({
            name: name,
            roll: roll,
            course: course,
            attendance: false
        });

        document.getElementById("studentName").value = "";
        document.getElementById("rollNo").value = "";
        document.getElementById("course").value = "";

        displayStudents();
        updateDashboard();
    }


    // Display Students
    function displayStudents() {

        let table = document.getElementById("studentTable");

        table.innerHTML = "";

        students.forEach(function(student, index) {

            let row = `
                <tr>
                    <td>${index + 1}</td>
                    <td>${student.name}</td>
                    <td>${student.roll}</td>
                    <td>${student.course}</td>

                    <td>
                        <button onclick="markAttendance(${index})">
                            ${student.attendance ? "Present" : "Mark Present"}
                        </button>
                    </td>

                    <td>
                        <button class="delete-btn"
                        onclick="deleteStudent(${index})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;

            table.innerHTML += row;
        });
    }


    // Mark Attendance
    function markAttendance(index) {

        students[index].attendance = !students[index].attendance;

        displayStudents();
        updateDashboard();
    }


    // Delete Student
    function deleteStudent(index) {

        if (confirm("Are you sure you want to delete this student?")) {

            students.splice(index, 1);

            displayStudents();
            updateDashboard();
        }
    }


    // Add Class
    function addClass() {

        let className = document.getElementById("className").value;

        if (className === "") {
            alert("Please enter class name!");
            return;
        }

        classes.push(className);

        document.getElementById("className").value = "";

        displayClasses();
        updateDashboard();
    }


    // Display Classes
    function displayClasses() {

        let list = document.getElementById("classList");

        list.innerHTML = "";

        classes.forEach(function(className, index) {

            list.innerHTML += `
                <li>
                    ${className}
                    <button class="delete-btn"
                    onclick="deleteClass(${index})">
                        Delete
                    </button>
                </li>
            `;
        });
    }


    // Delete Class
    function deleteClass(index) {

        classes.splice(index, 1);

        displayClasses();
        updateDashboard();
    }


    
    function updateDashboard() {

        document.getElementById("studentCount").innerText =
            students.length;

        document.getElementById("classCount").innerText =
            classes.length;

        let present = students.filter(function(student) {
            return student.attendance === true;
        }).length;

        document.getElementById("attendanceCount").innerText =
            present;
    }

</script>

</body>
</html>
